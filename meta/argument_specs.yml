---
argument_specs:
  main:
    author: Niclas Spreng
    description: Setup Gitea with Docker Compose.
    short_description: gitea_docker
    options:
      gitea_docker_image:
        type: str
        required: true
        description: Gitea Docker image to use.
      gitea_docker_path:
        type: str
        required: true
        description: Directory path for Gitea deployment.
      gitea_docker_owner:
        type: str
        required: true
        description: Owner of Gitea files and directories.
      gitea_docker_group:
        type: str
        required: true
        description: Group of Gitea files and directories.
      gitea_docker_env:
        type: dict
        required: false
        description: Configure Gitea environment variables.
      gitea_docker_compose_override:
        type: dict
        required: false
        description: Docker Compose override configuration.
